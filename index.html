<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Molly: The Starlight Garden</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>The Starlight Garden</h1>

      <div class="story-panel">
        <canvas id="storyCanvas" width="900" height="480"></canvas>
      </div>

      <div class="text-panel">
        <h2 id="sceneTitle">Scene 1</h2>

      <div class="controls">
        <button id="prevBtn">Previous</button>
        <button id="nextBtn">Next</button>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
